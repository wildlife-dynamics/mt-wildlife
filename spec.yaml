id: mt_wildlife

requirements:
  - name: ecoscope-platform
    version: ">=2.18.0, <2.19.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/
  - name: ecoscope-workflows-ext-custom
    version: "0.1.0rc24"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/
  - name: pydeck
    version: "0.9.2"
    channel: conda-forge

rjsf-overrides:
  properties:
    Process Sightings.properties.featured_list.title: "Featured Species"
    Process Sightings.properties.featured_list.description: "Each featured species generates its own map. All remaining species are combined into one map."
    Process Sightings.properties.featured_list.properties.vars.title: "Species"
    Process Sightings.properties.featured_list.properties.vars.default:
      - "Buffalo"
      - "Elephant"
      - "Lion"
      - "Leopard"
      - "Cheetah"
      - "Giraffe Maasai"
      - "Zebra"
      - "Wildebeest"
    base_map_defs.properties.base_maps.default:
      - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"
        opacity: 1
    persist_sightings.properties.filetypes.default: ["parquet"]
    persist_sightings.properties.filetypes.items.enum: ["csv", "parquet"]

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:
  # Setup
  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Time Range
    id: time_range
    task: set_time_range
    partial:
      time_format: '%d %b %Y %H:%M:%S %Z'

  - name: Extract Timezone
    id: get_timezone
    task: get_timezone_from_time_range
    partial:
      time_range: ${{ workflow.time_range.return }}

  - name: Data Source
    id: er_client_name
    task: set_er_connection

  - name: Get Wildlife Sighting Events
    id: er_events
    task: get_events
    partial:
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      event_types: ["wildlife_sightings"]
      event_columns: null
      include_null_geometry: false
      raise_on_empty: false
      include_details: true
      include_updates: false
      include_related_events: false
      include_display_values: true
      force_point_geometry: true

  # Processing
  - title: Process Sightings
    type: task-group
    description: "Process EarthRanger events into wildlife sighting records."
    tasks:
      - name: Convert to Timezone
        id: convert_tz
        task: convert_values_to_timezone
        partial:
          df: ${{ workflow.er_events.return }}
          timezone: ${{ workflow.get_timezone.return }}
          columns: ["time"]
          auto_detect: false

      - name: Process Event Details
        id: process_event_details
        task: process_events_details
        partial:
          df: ${{ workflow.convert_tz.return }}
          client: ${{ workflow.er_client_name.return }}
          map_to_titles: true
          ordered: true

      - name: Normalize Event Details
        id: normalize_event_details
        task: normalize_json_column
        partial:
          df: ${{ workflow.process_event_details.return }}
          column: "event_details"
          skip_if_not_exists: true
          sort_columns: false

      - name: Remove Event Details Prefix
        id: drop_event_details_prefix
        task: drop_column_prefix
        partial:
          df: ${{ workflow.normalize_event_details.return }}
          prefix: "event_details__"
          duplicate_strategy: "suffix"

      - name: Filter Coordinates
        id: filter_coords
        task: apply_reloc_coord_filter
        partial:
          df: ${{ workflow.drop_event_details_prefix.return }}
          roi_gdf: null
          roi_name: null
          reset_index: false
          bounding_box:
            min_x: -180.0
            max_x: 180.0
            min_y: -90.0
            max_y: 90.0
          filter_point_coords:
            - {x: 180.0, y: 90.0}
            - {x: 0.0, y: 0.0}
            - {x: 1.0, y: 1.0}

      - name: Process Sighting Columns
        id: process_sightings
        task: apply_sql_query
        partial:
          df: ${{ workflow.filter_coords.return }}
          columns: null
          sanitize: true
          query: >-
            SELECT id, serial_number, time, geometry,
              "Species",
              COALESCE(CAST("Count" AS REAL), 0) AS "Count"
            FROM df
            WHERE "Species" IS NOT NULL

      - name: Apply Colormap
        id: sightings_colormap
        task: apply_color_map
        partial:
          df: ${{ workflow.process_sightings.return }}
          input_column_name: "Species"
          output_column_name: "species_colormap"
          colormap: "Dark2"

      - name: Set Featured Species List
        id: featured_list
        task: set_list_of_string_vars

      - name: Filter Featured Species
        id: featured_species
        task: filter_row_values
        partial:
          df: ${{ workflow.sightings_colormap.return }}
          column: "Species"
          values: ${{ workflow.featured_list.return }}

      - name: Filter Other Species
        id: other_species
        task: exclude_row_values
        partial:
          df: ${{ workflow.sightings_colormap.return }}
          column: "Species"
          values: ${{ workflow.featured_list.return }}

  # Summary
  - name: Summarize Wildlife Sightings
    id: wildlife_summary
    task: summarize_df
    partial:
      df: ${{ workflow.process_sightings.return }}
      groupby_cols: ["Species"]
      reset_index: false
      summary_params:
        - display_name: "Sightings Count"
          aggregator: count
          column: Count
        - display_name: "Individuals Count"
          aggregator: sum
          column: Count

  - name: Persist Summary
    id: persist_summary
    task: persist_df_wrapper
    partial:
      df: ${{ workflow.wildlife_summary.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_prefix: "wildlife_summary"
      filetypes: ["csv"]
      sanitize: false
    skipif:
      conditions:
        - never

  # Map Settings
  - name: Base Maps
    id: base_map_defs
    task: set_base_maps

  # Featured Species Maps
  - title: Featured Species Maps
    type: task-group
    description: "Generate one map per featured species."
    tasks:
      - name: Species Groupers
        id: species_groupers
        task: set_groupers
        partial:
          groupers:
            - index_name: "Species"

      - name: Split by Species
        id: split_species
        task: split_groups
        partial:
          df: ${{ workflow.featured_species.return }}
          groupers: ${{ workflow.species_groupers.return }}

      - name: Featured Map Title
        id: set_featured_title
        task: set_string_var
        partial:
          var: "Wildlife Sightings"

      - name: Create Featured Point Layers
        id: featured_point_layers
        task: create_point_layer
        skipif:
          conditions:
            - any_is_empty_df
            - any_dependency_skipped
            - all_geometry_are_none
        partial:
          layer_style:
            get_radius: 5.0
            fill_color_column: "species_colormap"
          legend:
            label_column: "Species"
            color_column: "species_colormap"
          tooltip_columns: null
        mapvalues:
          argnames: geodataframe
          argvalues: ${{ workflow.split_species.return }}

      - name: Draw Featured Ecomaps
        id: featured_ecomap
        task: draw_ecomap
        partial:
          tile_layers: ${{ workflow.base_map_defs.return }}
          north_arrow_style:
            placement: "top-left"
          legend_style:
            title: "Species"
            format_title: true
            placement: "bottom-right"
          static: false
          title: null
          max_zoom: 13
        mapvalues:
          argnames: geo_layers
          argvalues: ${{ workflow.featured_point_layers.return }}

      - name: Persist Featured Ecomaps
        id: featured_ecomap_html
        task: persist_text
        partial:
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: "species_map"
        mapvalues:
          argnames: text
          argvalues: ${{ workflow.featured_ecomap.return }}

  # Other Species Map
  - title: Other Species Map
    type: task-group
    description: "Generate one combined map for all non-featured species."
    tasks:
      - name: Create Other Point Layer
        id: other_point_layer
        task: create_point_layer
        skipif:
          conditions:
            - any_is_empty_df
            - any_dependency_skipped
            - all_geometry_are_none
        partial:
          geodataframe: ${{ workflow.other_species.return }}
          layer_style:
            get_radius: 5.0
            fill_color_column: "species_colormap"
          legend:
            label_column: "Species"
            color_column: "species_colormap"
          tooltip_columns: null

      - name: Other Map Title
        id: set_other_title
        task: set_string_var
        partial:
          var: "Wildlife Sightings - Other Species"

      - name: Draw Other Ecomap
        id: other_ecomap
        task: draw_ecomap
        partial:
          geo_layers: ${{ workflow.other_point_layer.return }}
          tile_layers: ${{ workflow.base_map_defs.return }}
          north_arrow_style:
            placement: "top-left"
          legend_style:
            title: "Species"
            format_title: true
            placement: "bottom-right"
          static: false
          title: null
          max_zoom: 13

      - name: Persist Other Ecomap
        id: other_ecomap_html
        task: persist_text
        partial:
          text: ${{ workflow.other_ecomap.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: "other_species_map"

  # Data Export
  - name: Persist Sightings Data
    id: persist_sightings
    task: persist_df_wrapper
    partial:
      df: ${{ workflow.process_sightings.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_prefix: "wildlife_sightings"
      sanitize: true
    skipif:
      conditions:
        - never

  # Report
  - name: Report Groupers
    id: report_groupers
    task: set_groupers
    partial:
      groupers:
        - index_name: "Species"

  - name: Create Wildlife Report
    id: wildlife_report
    task: ecoscope_workflows_ext_custom.tasks.results.create_docx
    partial:
      context:
        items:
          - item_type: timerange
            key: report_date
            value: ${{ workflow.time_range.return }}
            format: "%b %Y"
          - item_type: table
            key: summary
            value: ${{ workflow.wildlife_summary.return }}
          - item_type: image
            key: species_maps
            value: ${{ workflow.featured_ecomap_html.return }}
            include_column_name_in_title: false
            screenshot_config:
              wait_for_timeout: 1000
              max_concurrent_pages: 2
              device_scale_factor: 1.0
          - item_type: image
            key: other_map
            value: ${{ workflow.other_ecomap_html.return }}
            screenshot_config:
              wait_for_timeout: 1000
              max_concurrent_pages: 2
      groupers: ${{ workflow.report_groupers.return }}
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_prefix: mt_wildlife_report
      template_path: "https://raw.githubusercontent.com/wildlife-dynamics/mt-wildlife/main/resources/templates/mt_wildlife_report_template.docx"
      skip: true
    skipif:
      conditions:
        - never

  # Dashboard (empty — report-driven)
  - name: Create Dashboard
    id: dashboard
    task: gather_dashboard
    partial:
      details: ${{ workflow.workflow_details.return }}
      widgets: []
      groupers:
        - index_name: "Species"
      time_range: ${{ workflow.time_range.return }}
