base:
  name: Integration Test
  mock_io: false
  params:
    workflow_details:
      name: "Mara Triangle Wildlife Sightings"
      description: "Wildlife sighting analysis for Mara Triangle conservancy."
    time_range:
      since: "2026-07-01T00:00:00"
      until: "2026-07-31T23:59:59"
      timezone:
        label: "(GMT+03:00) Nairobi"
        tzCode: "Africa/Nairobi"
        name: "East Africa Time"
        utc: "+03:00"
    er_client_name:
      data_source:
        name: "mmnr"
    featured_list:
      vars:
        - "Buffalo"
        - "Elephant"
        - "Lion"
        - "Leopard"
        - "Cheetah"
        - "Giraffe Maasai"
        - "Zebra"
        - "Wildebeest"
    base_map_defs:
      base_maps:
        - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"
          opacity: 1
    persist_sightings:
      filetypes: ["parquet"]
